
services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: reservoir-rabbitmq
    ports:
      - "5672:5672"    # AMQP — services connect here
      - "15672:15672"  # Management UI — open in browser
    environment:
      RABBITMQ_DEFAULT_USER: reservoir
      RABBITMQ_DEFAULT_PASS: reservoir
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # `ping` returns OK as soon as the Erlang node is alive — too early;
      # the AMQP listener on :5672 may not be bound yet and consumers crash
      # with Connection refused. `check_port_connectivity` actively probes
      # the AMQP port so "healthy" means "ready to accept connections".
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - reservoir-net

  postgres:
    image: postgres:16
    container_name: reservoir-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: reservoir
      POSTGRES_PASSWORD: reservoir
      POSTGRES_DB: reservoir
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservoir -d reservoir"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - reservoir-net

  order-service:
    build:
      context: .
      dockerfile: docker/order.Dockerfile
    container_name: reservoir-order
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "5294:5294"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrdersDb: "Host=postgres;Port=5432;Database=reservoir;Username=reservoir;Password=reservoir;Search Path=orders"
      RabbitMq__HostName: rabbitmq
    networks:
      - reservoir-net

  payment-service:
    build:
      context: .
      dockerfile: docker/payment.Dockerfile
    container_name: reservoir-payment
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "5203:5203"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PaymentsDb: "Host=postgres;Port=5432;Database=reservoir;Username=reservoir;Password=reservoir;Search Path=payments"
      ConnectionStrings__ChaosConfigDb: "Host=postgres;Port=5432;Database=reservoir;Username=reservoir;Password=reservoir;Search Path=chaos"
      RabbitMq__HostName: rabbitmq
    networks:
      - reservoir-net

  kitchen-service:
    build:
      context: .
      dockerfile: docker/kitchen.Dockerfile
    container_name: reservoir-kitchen
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "5233:5233"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__KitchenDb: "Host=postgres;Port=5432;Database=reservoir;Username=reservoir;Password=reservoir;Search Path=kitchen"
      RabbitMq__HostName: rabbitmq
    networks:
      - reservoir-net

  delivery-service:
    build:
      context: .
      dockerfile: docker/delivery.Dockerfile
    container_name: reservoir-delivery
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "5097:5097"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DeliveryDb: "Host=postgres;Port=5432;Database=reservoir;Username=reservoir;Password=reservoir;Search Path=delivery"
      RabbitMq__HostName: rabbitmq
    networks:
      - reservoir-net

  dashboard-api:
    build:
      context: .
      dockerfile: docker/dashboard-api.Dockerfile
    container_name: reservoir-dashboard-api
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ChaosConfigDb: "Host=postgres;Port=5432;Database=reservoir;Username=reservoir;Password=reservoir;Search Path=chaos"
      RabbitMq__HostName: rabbitmq
    networks:
      - reservoir-net

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: reservoir-dashboard
    depends_on:
      - dashboard-api
    ports:
      - "3000:3000"
    networks:
      - reservoir-net

volumes:
  rabbitmq-data:
  postgres-data:

networks:
  reservoir-net:
    driver: bridge
