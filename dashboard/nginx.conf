server {
    listen       3000;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy SignalR hub to the backend (update host when hub service is named)
    # location /hub {
    #     proxy_pass         http://dashboard-hub:5000/hub;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade $http_upgrade;
    #     proxy_set_header   Connection "upgrade";
    # }

    # No caching for index.html so deploys take effect immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache static assets aggressively (hashed filenames by CRA)
    location ~* \.(js|css|png|jpg|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
